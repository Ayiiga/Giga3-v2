<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5B21B6" />
  <title>Connection issue — Giga3 AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(165deg, #faf5ff 0%, #fff 45%, #f5f3ff 100%);
      color: #1e1b4b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      background: #fff;
      border: 1px solid #e9d5ff;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 8px 32px rgba(91, 33, 182, 0.08);
    }
    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6D28D9, #7C3AED);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 28px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .status.checking { background: #f3e8ff; color: #5B21B6; }
    .status.online { background: #dcfce7; color: #166534; }
    .status.offline { background: #fee2e2; color: #991b1b; }
    .status.degraded { background: #fef3c7; color: #92400e; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: currentColor;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
    p { font-size: 14px; line-height: 1.6; color: #64748b; margin: 0 0 20px; }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    button, a.btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 0 20px; border-radius: 12px;
      font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer;
      border: none; width: 100%;
    }
    .primary { background: #5B21B6; color: #fff; }
    .primary:hover { background: #4c1d95; }
    .secondary { background: #fff; color: #1e1b4b; border: 1px solid #e2e8f0; }
    .secondary:hover { border-color: #c4b5fd; }
    .hint { font-size: 12px; color: #94a3b8; margin-top: 16px; line-height: 1.5; }
    #cached-offer { display: none; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">G</div>
    <div id="status" class="status checking" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">Checking connection…</span>
    </div>
    <h1>Having trouble reaching Giga3</h1>
    <p id="message">
      Your device may be offline, or our servers are temporarily unreachable.
      We&apos;ll retry automatically when a connection is available.
    </p>
    <div class="actions">
      <button type="button" class="primary" id="retry">Try again</button>
      <a class="btn secondary" href="/">Go to home</a>
      <button type="button" class="secondary" id="cached-btn" style="display:none">
        Open cached version
      </button>
    </div>
    <p class="hint" id="cached-offer">
      A previously visited page may still work offline after one online visit.
    </p>
  </div>
  <script>
(function () {
  var RETRY_MS = 3000;
  var HEALTH_TIMEOUT_MS = 5000;
  var statusEl = document.getElementById("status");
  var statusText = document.getElementById("status-text");
  var messageEl = document.getElementById("message");
  var retryBtn = document.getElementById("retry");
  var cachedBtn = document.getElementById("cached-btn");
  var cachedOffer = document.getElementById("cached-offer");
  var retryTimer = null;
  var checking = false;

  function setStatus(kind, text) {
    statusEl.className = "status " + kind;
    statusText.textContent = text;
  }

  function withTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      var timer = setTimeout(function () { reject(new Error("timeout")); }, ms);
      promise.then(function (v) { clearTimeout(timer); resolve(v); })
        .catch(function (e) { clearTimeout(timer); reject(e); });
    });
  }

  function checkHealth() {
    return withTimeout(
      fetch("/api/health", { cache: "no-store", credentials: "same-origin" })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); }),
      HEALTH_TIMEOUT_MS
    );
  }

  function hasCachedShell() {
    if (!("caches" in window)) return Promise.resolve(false);
    return caches.keys().then(function (keys) {
      return keys.some(function (k) { return /giga3/i.test(k); });
    });
  }

  function showCachedOffer(hasCache) {
    if (!hasCache) return;
    cachedBtn.style.display = "";
    cachedOffer.style.display = "";
  }

  function scheduleRetry() {
    if (retryTimer) clearTimeout(retryTimer);
    retryTimer = setTimeout(function () {
      if (navigator.onLine) runCheck(true);
    }, RETRY_MS);
  }

  function runCheck(silent) {
    if (checking) return;
    checking = true;
    if (!silent) setStatus("checking", "Checking connection…");

    var browserOnline = navigator.onLine;
    if (!browserOnline) {
      setStatus("offline", "Device appears offline");
      messageEl.textContent = "No network detected. Connect to Wi‑Fi or mobile data and we will retry automatically.";
      hasCachedShell().then(showCachedOffer);
      checking = false;
      scheduleRetry();
      return;
    }

    setStatus("checking", "Testing server reachability…");
    checkHealth()
      .then(function () {
        setStatus("online", "Connection restored");
        messageEl.textContent = "Giga3 is reachable again. Reloading…";
        var target = sessionStorage.getItem("giga3_offline_return") || "/";
        setTimeout(function () { window.location.replace(target); }, 400);
      })
      .catch(function () {
        setStatus("degraded", "Server unreachable");
        messageEl.textContent =
          "Your connection looks active but www.giga3ai.com did not respond in time. " +
          "This is usually temporary — tap Try again or wait for an automatic retry.";
        hasCachedShell().then(showCachedOffer);
        scheduleRetry();
      })
      .finally(function () { checking = false; });
  }

  retryBtn.addEventListener("click", function () { runCheck(false); });

  cachedBtn.addEventListener("click", function () {
    var target = sessionStorage.getItem("giga3_offline_return") || "/chat/";
    window.location.assign(target);
  });

  window.addEventListener("online", function () { runCheck(true); });
  window.addEventListener("offline", function () {
    setStatus("offline", "Device appears offline");
    scheduleRetry();
  });

  try {
    if (!sessionStorage.getItem("giga3_offline_return")) {
      sessionStorage.setItem("giga3_offline_return", document.referrer || "/");
    }
  } catch (_) {}

  runCheck(true);
})();
  </script>
</body>
</html>
