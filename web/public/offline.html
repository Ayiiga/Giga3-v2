<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5B21B6" />
  <meta name="description" content="Giga3 AI connection status — retry when back online or open a cached page." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://www.giga3ai.com/offline.html" />
  <title>Giga3 AI — Connection</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(165deg, #faf5ff 0%, #fff 45%, #f5f3ff 100%);
      color: #1e1b4b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      background: #fff;
      border: 1px solid #e9d5ff;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 8px 32px rgba(91, 33, 182, 0.08);
    }
    .logo {
      width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 14px;
      background: linear-gradient(135deg, #5B21B6, #7C3AED);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 28px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
    .status {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 600; padding: 6px 12px;
      border-radius: 999px; margin-bottom: 12px;
    }
    .status.offline { background: #fee2e2; color: #991b1b; }
    .status.online { background: #dcfce7; color: #166534; }
    .status.checking { background: #f3e8ff; color: #5B21B6; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
    .dot.pulse { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
    p { font-size: 14px; line-height: 1.6; color: #64748b; margin: 0 0 20px; }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    button, a.btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 0 20px; border-radius: 12px;
      font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer;
      border: none; width: 100%;
    }
    .primary { background: #5B21B6; color: #fff; }
    .secondary { background: #fff; color: #1e1b4b; border: 1px solid #e2e8f0; }
    .hint { font-size: 12px; color: #94a3b8; margin-top: 14px; line-height: 1.5; }
    #cached { display: none; margin-top: 10px; font-size: 13px; color: #5B21B6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">G</div>
    <div id="status" class="status checking" role="status" aria-live="polite">
      <span id="dot" class="dot pulse" aria-hidden="true"></span>
      <span id="status-text">Checking connection…</span>
    </div>
    <h1 id="title">Connecting to Giga3</h1>
    <p id="message">We&apos;ll retry automatically when your connection is back.</p>
    <div class="actions">
      <button type="button" class="primary" id="retry">Try again</button>
      <a class="btn secondary" href="/">Go to home</a>
    </div>
    <p id="cached">Cached version available — open home or chat from your last visit.</p>
  </div>
  <script>
(function () {
  var RETRY_MS = 3000;
  var HEALTH_MS = 5000;
  var statusEl = document.getElementById("status");
  var statusText = document.getElementById("status-text");
  var titleEl = document.getElementById("title");
  var messageEl = document.getElementById("message");
  var dotEl = document.getElementById("dot");
  var cachedEl = document.getElementById("cached");
  var retryTimer = null;
  var checking = false;

  function setOffline() {
    statusEl.className = "status offline";
    dotEl.className = "dot";
    statusText.textContent = "You're offline";
    titleEl.textContent = "You're offline";
    messageEl.textContent = "No network detected. We'll retry every 3 seconds when you're back online.";
  }

  function setOnline() {
    statusEl.className = "status online";
    dotEl.className = "dot";
    statusText.textContent = "Back online";
    titleEl.textContent = "Back online";
    messageEl.textContent = "Connection restored. Reloading Giga3…";
  }

  function setChecking() {
    statusEl.className = "status checking";
    dotEl.className = "dot pulse";
    statusText.textContent = "Checking connection…";
  }

  function withTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      var t = setTimeout(function () { reject(new Error("timeout")); }, ms);
      promise.then(function (v) { clearTimeout(t); resolve(v); })
        .catch(function (e) { clearTimeout(t); reject(e); });
    });
  }

  function checkHealth() {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, HEALTH_MS);
    return fetch("/api/health", { cache: "no-store", signal: ctrl.signal })
      .then(function (r) {
        clearTimeout(timer);
        return r.ok ? r.json() : Promise.reject(r.status);
      })
      .catch(function (e) { clearTimeout(timer); throw e; });
  }

  function clearGigaCaches() {
    if (!("caches" in window)) return Promise.resolve();
    return caches.keys().then(function (keys) {
      return Promise.all(keys.filter(function (k) { return k.indexOf("giga3") === 0; })
        .map(function (k) { return caches.delete(k); }));
    });
  }

  function showCachedIfAny() {
    if (!("caches" in window)) return;
    caches.match("/").then(function (hit) {
      if (hit) cachedEl.style.display = "block";
    });
  }

  function scheduleRetry() {
    if (retryTimer) clearTimeout(retryTimer);
    retryTimer = setTimeout(runCheck, RETRY_MS);
  }

  function runCheck() {
    if (checking) return;
    checking = true;
    setChecking();
    if (!navigator.onLine) {
      setOffline();
      showCachedIfAny();
      checking = false;
      scheduleRetry();
      return;
    }
    checkHealth()
      .then(function () {
        setOnline();
        setTimeout(function () { location.reload(); }, 350);
      })
      .catch(function () {
        setOffline();
        messageEl.textContent = "Your device is online but Giga3 didn't respond yet. Retrying…";
        showCachedIfAny();
        scheduleRetry();
      })
      .finally(function () { checking = false; });
  }

  document.getElementById("retry").addEventListener("click", function () {
    clearGigaCaches().finally(function () { location.reload(); });
  });

  window.addEventListener("online", runCheck);
  window.addEventListener("offline", function () { setOffline(); scheduleRetry(); });

  showCachedIfAny();
  runCheck();
})();
  </script>
</body>
</html>
