<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" role="img" aria-labelledby="title desc">
<title id="title">Collecting gas over water</title><desc id="desc">The jar starts completely filled with water. Incoming gas pushes water out of the jar. Use for gases with low solubility in water.</desc>
