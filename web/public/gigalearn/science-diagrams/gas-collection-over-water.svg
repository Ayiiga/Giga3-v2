<rect x="14" y="595" width="422" height="162" rx="16" fill="#ebe2fc"/>
<text x="32" y="628" fill="#6235ab" font-size="16" font-weight="700" text-anchor="start">WHAT TO NOTICE</text>
<text x="32" y="661" fill="#263454" font-size="16" font-weight="500" text-anchor="start">The jar starts completely filled with water.</text><text x="32" y="691" fill="#263454" font-size="16" font-weight="500" text-anchor="start">Incoming gas pushes water out of the jar.</text><text x="32" y="721" fill="#263454" font-size="16" font-weight="500" text-anchor="start">Use for gases with low solubility in water.</text>
