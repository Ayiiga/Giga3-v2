<text x="24" y="79" fill="white" font-size="31" font-weight="700" text-anchor="start">Collecting gas over water</text>
<text x="24" y="111" fill="#e2d8f5" font-size="16" font-weight="500" text-anchor="start">Water displacement in an inverted gas jar</text>
<rect x="14" y="153" width="422" height="427" rx="18" fill="white" stroke="#d9ccef"/>
