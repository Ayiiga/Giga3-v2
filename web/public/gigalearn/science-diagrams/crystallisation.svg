<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" role="img" aria-labelledby="title desc">
<title id="title">Crystallisation</title><desc id="desc">Choose a solute less soluble in cooler water. On cooling, excess dissolved solute crystallises. Separate the crystals from the remaining liquid.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6235ab"/></marker></defs>
<g font-family="system-ui, sans-serif">
<rect width="450" height="800" fill="#f5f1fd"/>
<rect width="450" height="136" fill="#291846"/>
<text x="24" y="35" fill="#d6c4ff" font-size="16" font-weight="700" text-anchor="start">GIGALEARN  /  SCIENCE VISUALS</text>
<text x="24" y="79" fill="white" font-size="31" font-weight="700" text-anchor="start">Crystallisation</text>
<text x="24" y="111" fill="#e2d8f5" font-size="16" font-weight="500" text-anchor="start">Cooling a hot, saturated solution</text>
<rect x="14" y="153" width="422" height="427" rx="18" fill="white" stroke="#d9ccef"/>
<path d="M53 300v150h126v-150" fill="#f1f8ff" stroke="#263454" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 364h122v84h-122Z" fill="#d9effd" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 364h122" fill="none" stroke="#4e9aca" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M272 300v150h126v-150" fill="#f1f8ff" stroke="#263454" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M274 364h122v84h-122Z" fill="#d9effd" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M274 364h122" fill="none" stroke="#4e9aca" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M284 430l12-14 13 13-10 12Z M318 437l12-18 13 12-11 14Z M354 432l14-17 16 11-11 15Z" fill="#8270c4" stroke="#263454" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M186 372h74" fill="none" stroke="#6235ab" stroke-width="2.5" marker-end="url(#arrow)"/><text x="224" y="352" fill="#263454" font-size="16" font-weight="700" text-anchor="middle">Cool</text><text x="116" y="247" fill="#263454" font-size="16" font-weight="700" text-anchor="middle">Hot saturated</text><text x="116" y="269" fill="#263454" font-size="16" font-weight="700" text-anchor="middle">solution</text><path d="M344 252l-18 168" fill="none" stroke="#6235ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="279" y="246" fill="#263454" font-size="15" font-weight="700" text-anchor="start">Crystals form</text><text x="225" y="512" fill="#263454" font-size="15" font-weight="700" text-anchor="middle">Crystals remain in the surrounding liquid.</text>
<rect x="14" y="595" width="422" height="162" rx="16" fill="#ebe2fc"/>
<text x="32" y="628" fill="#6235ab" font-size="16" font-weight="700" text-anchor="start">WHAT TO NOTICE</text>
<text x="32" y="661" fill="#263454" font-size="16" font-weight="500" text-anchor="start">Choose a solute less soluble in cooler water.</text><text x="32" y="691" fill="#263454" font-size="16" font-weight="500" text-anchor="start">On cooling, excess dissolved solute crystallises.</text><text x="32" y="721" fill="#263454" font-size="16" font-weight="500" text-anchor="start">Separate the crystals from the remaining liquid.</text>
<text x="225" y="781" fill="#6235ab" font-size="12" font-weight="700" text-anchor="middle">CLASSROOM STUDY DIAGRAM  •  NOT TO SCALE</text>
</g></svg>
