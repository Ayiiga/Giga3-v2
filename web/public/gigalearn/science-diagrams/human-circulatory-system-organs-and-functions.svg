<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-labelledby="title description">
<title id="title">Circulatory system</title>
<desc id="description">Heart pumps blood; Lung circulation; Arteries carry blood away; Veins carry blood back; Capillaries exchange substances</desc>
<rect width="360" height="640" fill="white"/>
<rect width="360" height="132" fill="#eef2ff"/>
<text x="180" y="45" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#162c46">GIGALEARN · INTEGRATED SCIENCE</text>
<text x="180" y="81" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="600" fill="#162c46">Circulatory system</text>
<defs>
<marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
<path d="M0 0l6 3L0 6z" fill="#263652"/>
</marker>
</defs>
<rect x="117" y="173" width="126" height="34" rx="9" fill="#f4acb4"/>
<text x="180" y="195" text-anchor="middle" font-family="sans-serif" font-size="13">Lung capillaries</text>
<rect x="27" y="298" width="126" height="34" rx="9" fill="#cce7fa"/>
<text x="90" y="320" text-anchor="middle" font-family="sans-serif" font-size="13">Right heart</text>
<rect x="207" y="298" width="126" height="34" rx="9" fill="#f4acb4"/>
<text x="270" y="320" text-anchor="middle" font-family="sans-serif" font-size="13">Left heart</text>
<rect x="117" y="423" width="126" height="34" rx="9" fill="#e5d5f4"/>
<text x="180" y="445" text-anchor="middle" font-family="sans-serif" font-size="13">Body capillaries</text>
<path d="M90 295V190h22" fill="none" stroke="#2974a8" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M244 190h26v105" fill="none" stroke="#b94360" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M270 334v106h-24" fill="none" stroke="#b94360" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M115 440H90V335" fill="none" stroke="#2974a8" stroke-width="4" marker-end="url(#arrow)"/>
<g font-family="sans-serif" font-size="14" fill="#162c46">
<text x="35" y="496">Right heart → lungs → left heart</text>
<text x="35" y="526">Left heart → body → right heart</text>
<text x="35" y="566">Arteries carry blood away from the heart.</text>
<text x="35" y="596">Veins carry blood back to the heart.</text>
</g>
</svg>
