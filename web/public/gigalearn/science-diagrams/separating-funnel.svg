<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" role="img" aria-labelledby="title desc">
<title id="title">Separating-funnel separation</title><desc id="desc">The liquids do not mix. Water is denser here. The lower layer drains through the stopcock. Remove the stopper before draining.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6235ab"/></marker></defs>
<g font-family="system-ui, sans-serif">
<rect width="450" height="800" fill="#f5f1fd"/>
<rect width="450" height="136" fill="#291846"/>
<text x="24" y="35" fill="#d6c4ff" font-size="16" font-weight="700" text-anchor="start">GIGALEARN  /  SCIENCE VISUALS</text>
<text x="24" y="79" fill="white" font-size="26" font-weight="700" text-anchor="start">Separating-funnel separation</text>
<text x="24" y="111" fill="#e2d8f5" font-size="16" font-weight="500" text-anchor="start">Vegetable oil and water form two layers</text>
<rect x="14" y="153" width="422" height="427" rx="18" fill="white" stroke="#d9ccef"/>
<path d="M99 270v270h61" fill="none" stroke="#6d7896" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M99 320h50" fill="none" stroke="#6d7896" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M183 227v34q0 18-39 37-25 18-11 55 17 43 68 82v21h26v-21q51-39 68-82 14-37-11-55-39-19-39-37v-34Z" fill="#f1f8ff" stroke="#263454" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M135 340h158q-11 28-26 43H161q-19-20-26-43Z" fill="#ffe3a0" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M161 383h106q-19 27-42 47h-22q-25-20-42-47Z" fill="#d9effd" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M161 383h106" fill="none" stroke="#707ca3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M214 456v57" fill="none" stroke="#263454" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="192" y="453" width="45" height="12" rx="4" fill="#b6a6ce" stroke="#263454" stroke-width="2"/><path d="M173 505v43h83v-43" fill="#f1f8ff" stroke="#263454" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M175 535h79v11h-79Z" fill="#d9effd" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="214" cy="523" r="3" fill="#4c9ace"/><path d="M112 208h72v25" fill="none" stroke="#6235ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="214" fill="#263454" font-size="15" font-weight="700" text-anchor="start">Open neck</text><path d="M344 328l-55 29" fill="none" stroke="#6235ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="301" y="323" fill="#263454" font-size="15" font-weight="700" text-anchor="start">Oil above</text><path d="M301 396l-46 1" fill="none" stroke="#6235ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="301" y="390" fill="#263454" font-size="15" font-weight="700" text-anchor="start">Water below</text><path d="M267 460h-28" fill="none" stroke="#6235ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="460" fill="#263454" font-size="15" font-weight="700" text-anchor="start">Stopcock</text><path d="M266 540h-10" fill="none" stroke="#6235ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="546" fill="#263454" font-size="15" font-weight="700" text-anchor="start">Receiving beaker</text>
<rect x="14" y="595" width="422" height="162" rx="16" fill="#ebe2fc"/>
<text x="32" y="628" fill="#6235ab" font-size="16" font-weight="700" text-anchor="start">WHAT TO NOTICE</text>
<text x="32" y="661" fill="#263454" font-size="16" font-weight="500" text-anchor="start">The liquids do not mix. Water is denser here.</text><text x="32" y="691" fill="#263454" font-size="16" font-weight="500" text-anchor="start">The lower layer drains through the stopcock.</text><text x="32" y="721" fill="#263454" font-size="16" font-weight="500" text-anchor="start">Remove the stopper before draining.</text>
<text x="225" y="781" fill="#6235ab" font-size="12" font-weight="700" text-anchor="middle">CLASSROOM STUDY DIAGRAM  •  NOT TO SCALE</text>
</g></svg>
