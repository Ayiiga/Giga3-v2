<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" role="img" aria-labelledby="title desc">
<title id="title">Simple distillation</title><desc id="desc">Water vaporises and then condenses. Cooling water enters at the lower connection. Dissolved salt stays in the distilling flask.</desc>
