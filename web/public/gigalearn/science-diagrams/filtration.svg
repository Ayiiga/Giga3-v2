<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" role="img" aria-labelledby="title desc">
<title id="title">Filtration</title><desc id="desc">Filter paper traps the insoluble sand. Water passes through and is the filtrate. Dissolved salt would pass through as well.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6235ab"/></marker></defs>
<g font-family="system-ui, sans-serif">
<rect width="450" height="800" fill="#f5f1fd"/>
<rect width="450" height="136" fill="#291846"/>
<text x="24" y="35" fill="#d6c4ff" font-size="16" font-weight="700" text-anchor="start">GIGALEARN  /  SCIENCE VISUALS</text>
<text x="24" y="79" fill="white" font-size="31" font-weight="700" text-anchor="start">Filtration</text>
<text x="24" y="111" fill="#e2d8f5" font-size="16" font-weight="500" text-anchor="start">Separating insoluble sand from water</text>
<rect x="14" y="153" width="422" height="427" rx="18" fill="white" stroke="#d9ccef"/>
<path d="M144 259h162l-68 111v70h-26v-70Z" fill="#f1f8ff" stroke="#263454" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M155 268h140l-70 111Z" fill="#fff4d8" stroke="#263454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M178 304h94l-47 75Z" fill="#f0d4a6" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="213" cy="323" r="4" fill="#a76a33"/><circle cx="233" cy="331" r="4" fill="#a76a33"/><circle cx="223" cy="343" r="4" fill="#a76a33"/><path d="M166 423v105h118V423" fill="#f1f8ff" stroke="#263454" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M169 484h112v41H169Z" fill="#d9effd" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="225" cy="454" r="4" fill="#4d9ace"/><circle cx="225" cy="472" r="4" fill="#4d9ace"/><path d="M110 235l58 48" fill="none" stroke="#6235ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="239" fill="#263454" font-size="15" font-weight="700" text-anchor="start">Filter paper</text><path d="M285 321l-18 5" fill="none" stroke="#6235ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="287" y="316" fill="#263454" font-size="15" font-weight="700" text-anchor="start">Funnel</text><path d="M106 344l107-11" fill="none" stroke="#6235ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="346" fill="#263454" font-size="15" font-weight="700" text-anchor="start">Sand residue</text><path d="M290 498h-31" fill="none" stroke="#6235ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="492" fill="#263454" font-size="15" font-weight="700" text-anchor="start">Filtrate</text>
<rect x="14" y="595" width="422" height="162" rx="16" fill="#ebe2fc"/>
<text x="32" y="628" fill="#6235ab" font-size="16" font-weight="700" text-anchor="start">WHAT TO NOTICE</text>
<text x="32" y="661" fill="#263454" font-size="16" font-weight="500" text-anchor="start">Filter paper traps the insoluble sand.</text><text x="32" y="691" fill="#263454" font-size="16" font-weight="500" text-anchor="start">Water passes through and is the filtrate.</text><text x="32" y="721" fill="#263454" font-size="16" font-weight="500" text-anchor="start">Dissolved salt would pass through as well.</text>
<text x="225" y="781" fill="#6235ab" font-size="12" font-weight="700" text-anchor="middle">CLASSROOM STUDY DIAGRAM  •  NOT TO SCALE</text>
