<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-labelledby="title description">
<title id="title">Laboratory safety rules</title>
<desc id="description">Check risks before starting; Tell the teacher about incidents</desc>
<rect width="360" height="640" fill="white"/>
<rect width="360" height="132" fill="#eef2ff"/>
<text x="180" y="45" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#162c46">GIGALEARN · INTEGRATED SCIENCE</text>
<text x="180" y="81" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="600" fill="#162c46">Laboratory safety rules</text>
<path d="M91 217h178v192H91Z" fill="#f4f8fd" stroke="#27405b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="142" y="200" width="76" height="33" rx="8" fill="#c5d6df" stroke="#27405b" stroke-width="3"/>
<path d="M108 254l6 6 11-12" fill="none" stroke="#16775b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="133" y="260" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="600" fill="#162c46">Follow instructions</text>
<path d="M108 283l6 6 11-12" fill="none" stroke="#16775b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="133" y="289" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="600" fill="#162c46">Wear eye protection</text>
<path d="M108 312l6 6 11-12" fill="none" stroke="#16775b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="133" y="318" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="600" fill="#162c46">Keep workspaces clear</text>
<path d="M108 341l6 6 11-12" fill="none" stroke="#16775b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="133" y="347" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="600" fill="#162c46">No eating or drinking</text>
<path d="M108 370l6 6 11-12" fill="none" stroke="#16775b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="133" y="376" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="600" fill="#162c46">Report accidents promptly</text>
<path d="M180 213l22 -13" fill="none" stroke="#42496e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="202" cy="200" r="8.5" fill="#41367b"/>
<text x="202" y="203.4" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="white">1</text>
<path d="M211 366l22 12" fill="none" stroke="#42496e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="233" cy="378" r="8.5" fill="#41367b"/>
<text x="233" y="381.4" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="white">2</text>
<path d="M32 449h296" stroke="#d7daef" stroke-width="2"/>
<text x="36" y="467" text-anchor="start" font-family="sans-serif" font-size="13.2" font-weight="600" fill="#162c46">1.  Check risks before starting</text>
<text x="36" y="483.5" text-anchor="start" font-family="sans-serif" font-size="13.2" font-weight="600" fill="#162c46">2.  Tell the teacher about incidents</text>
<text x="180" y="624" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#162c46">Know where the eyewash and emergency equipment are.</text>
</svg>
