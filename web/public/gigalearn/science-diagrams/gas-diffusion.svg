<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" role="img" aria-labelledby="title desc">
<title id="title">Diffusion of a gas</title><desc id="desc">Particles move randomly in all directions. The net spread is from higher concentration to lower concentration, until more evenly mixed.</desc>
