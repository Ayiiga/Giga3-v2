<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" role="img" aria-labelledby="title desc">
<title id="title">Paper chromatography</title><desc id="desc">The starting spot sits above the solvent. The solvent moves up the paper. Different dyes travel different distances.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6235ab"/></marker></defs>
<g font-family="system-ui, sans-serif">
<rect width="450" height="800" fill="#f5f1fd"/>
<rect width="450" height="136" fill="#291846"/>
<text x="24" y="35" fill="#d6c4ff" font-size="16" font-weight="700" text-anchor="start">GIGALEARN  /  SCIENCE VISUALS</text>
<text x="24" y="79" fill="white" font-size="31" font-weight="700" text-anchor="start">Paper chromatography</text>
<text x="24" y="111" fill="#e2d8f5" font-size="16" font-weight="500" text-anchor="start">Separating soluble dyes in an ink sample</text>
<rect x="14" y="153" width="422" height="427" rx="18" fill="white" stroke="#d9ccef"/>
<path d="M106 253v256h239V253" fill="#f1f8ff" stroke="#263454" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="98" y="237" width="255" height="16" rx="4" fill="#a3acc6" stroke="#263454" stroke-width="2"/><path d="M168 253h112v241H168Z" fill="#fffdf2" stroke="#263454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M108 472h235v35H108Z" fill="#d9effd" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M168 431h112m-112-117h112" fill="none" stroke="#7584a5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="224" cy="429" r="6" fill="#453a6c"/><circle cx="224" cy="387" r="8" fill="#af4872"/><circle cx="224" cy="353" r="7" fill="#4556ad"/><path d="M195 412v-78" fill="none" stroke="#6235ab" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M123 303l45 11" fill="none" stroke="#6235ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="308" fill="#263454" font-size="15" font-weight="700" text-anchor="start">Solvent front</text><path d="M291 366l-59-14" fill="none" stroke="#6235ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="362" fill="#263454" font-size="15" font-weight="700" text-anchor="start">Dye spots</text><path d="M144 432h24" fill="none" stroke="#6235ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="25" y="438" fill="#263454" font-size="15" font-weight="700" text-anchor="start">Pencil baseline</text><path d="M302 532v-59" fill="none" stroke="#6235ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="267" y="550" fill="#263454" font-size="15" font-weight="700" text-anchor="start">Solvent level</text>
<rect x="14" y="595" width="422" height="162" rx="16" fill="#ebe2fc"/>
<text x="32" y="628" fill="#6235ab" font-size="16" font-weight="700" text-anchor="start">WHAT TO NOTICE</text>
<text x="32" y="661" fill="#263454" font-size="16" font-weight="500" text-anchor="start">The starting spot sits above the solvent.</text><text x="32" y="691" fill="#263454" font-size="16" font-weight="500" text-anchor="start">The solvent moves up the paper.</text><text x="32" y="721" fill="#263454" font-size="16" font-weight="500" text-anchor="start">Different dyes travel different distances.</text>
<text x="225" y="781" fill="#6235ab" font-size="12" font-weight="700" text-anchor="middle">CLASSROOM STUDY DIAGRAM  •  NOT TO SCALE</text>
</g></svg>
